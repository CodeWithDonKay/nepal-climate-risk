[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#14202B"
borderColor = "#DDE2E7"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap"
headingFontWeights = [600, 600, 600]
linkColor = "#2F4FA0"
dataframeHeaderBackgroundColor = "#F3F5F8"
chartCategoricalColors = ["#3B5BA9", "#B8243B", "#C9D1D9"]

[theme.sidebar]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#DDE2E7"
showSidebarBorder = true

[client]
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
