[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#334155"
borderColor = "#6B7C8F"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600]
linkColor = "#0072B2"
dataframeHeaderBackgroundColor = "#F1F5F9"
chartCategoricalColors = ["#0072B2", "#D55E00", "#009E73", "#CC79A7", "#E69F00", "#56B4E9"]

[theme.sidebar]
backgroundColor = "#112B49"
secondaryBackgroundColor = "#1B3A5F"
textColor = "#FFFFFF"
primaryColor = "#56B4E9"
borderColor = "#6B88A8"
showSidebarBorder = false

[client]
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
